name: HB ID checks
on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hb_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: hb_id_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hb_test -d hb_id_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Disposable database authentication tests
        run: npm run test:integration
        env:
          HB_ID_TEST_DATABASE_URL: postgresql://hb_test:disposable-ci-only@127.0.0.1:5432/hb_id_test
      - run: npm audit --omit=dev --audit-level=high
