<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HB ID — Mobile Design Preview</title><style>:root{color-scheme:dark;--bg:#080d18;--panel:#111c2c;--panel2:#18263b;--stroke:#2c3a50;--muted:#94a8c4;--white:#f4f8ff;--accent:#67e9bf;--accent2:#51a6ed;--danger:#ff9a9a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 80% -15%,#123d4d 0,transparent 42%),radial-gradient(ellipse at 3% 10%,#122345 0,transparent 34%),var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--white);min-height:100vh}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.container{max-width:1120px;margin:0 auto;padding:0 23px}.nav{border-bottom:1px solid #25364a91;background:#0b1522bc;backdrop-filter:blur(18px)}.nav .container{height:76px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:12px;font-size:23px;letter-spacing:-1px;font-weight:800}.brand em{font-style:normal;color:var(--accent)}.logo{width:39px;height:39px;border-radius:14px;background:linear-gradient(145deg,#86ffe0,#39aacb);display:grid;place-items:center;color:#082935;font-size:20px;box-shadow:0 8px 22px #00b5b633}.nav-links{display:flex;gap:12px;align-items:center}.pill,.button,.button-secondary,.button-danger{padding:12px 18px;border-radius:11px;display:inline-flex;gap:10px;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:1px solid transparent;transition:filter .15s}.pill{background:#1b3046;color:#e0edfd;border-color:#34475d}.button{color:#082526;background:linear-gradient(120deg,#87f7c9,#57cfb5);box-shadow:0 8px 30px #29e4b01b}.button:hover,.button-secondary:hover{filter:brightness(1.09)}.button-secondary{background:#203149;border-color:#385068;color:#eaf5ff}.button-danger{background:transparent;color:#ffb5b5;border-color:#80565d}.hero{padding:88px 0 60px;display:grid;grid-template-columns:1fr 440px;align-items:center;gap:62px}.eyebrow{color:#8bf0cd;text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:800}.hero h1{font-size:clamp(40px,5vw,67px);line-height:1.12;letter-spacing:-3.2px;margin:14px 0 18px}.gradient{background:linear-gradient(105deg,#87ffe1,#8fbffc);background-clip:text;-webkit-background-clip:text;color:transparent}.lead{font-size:16px;color:#afc0d5;line-height:1.85;max-width:580px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:27px}.hint{font-size:12px;color:#8ea7bf}.preview-shell{border:1px solid #355477;background:linear-gradient(145deg,#1b3049,#0d1523);border-radius:24px;box-shadow:0 35px 90px #0008;padding:25px;position:relative}.preview-shell:after{content:'';position:absolute;width:110px;height:110px;border-radius:100%;background:#18ecab20;filter:blur(30px);right:-19px;top:-28px;z-index:-1}.floating-label{display:inline-flex;gap:8px;align-items:center;padding:7px 12px;border:1px solid #3c566a;border-radius:60px;background:#122338;color:#aee6cd;font-size:11px}.mock-avatar{background:#143547;width:57px;height:57px;border-radius:18px;display:grid;place-items:center;font-size:25px;color:#b8ffe1;margin:25px 0 14px}.preview-shell h2{margin:0 0 7px;font-size:22px}.preview-shell p{color:var(--muted);font-size:13px;line-height:1.7}.mock-input{border:1px solid #3b4e65;padding:15px;border-radius:12px;color:#96aabe;margin-top:11px;font-size:12px}.mock-button{background:#78dfc4;color:#08302a;padding:15px;margin-top:17px;border-radius:12px;font-weight:800;text-align:center;font-size:13px}.bottom-caption{display:flex;align-items:center;justify-content:space-between;color:#a4bfd3;font-size:11px;margin-top:18px}.section{padding:34px 0 78px}.section h2{font-size:29px;margin:10px 0 12px;letter-spacing:-1px}.section-sub{color:#a1b3c8;font-size:14px;margin:0 0 25px;line-height:1.7}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.feature{background:#111e2d;border:1px solid #293c50;padding:23px;border-radius:17px}.feature .icon{font-size:26px;margin-bottom:19px}.feature strong{display:block;font-size:15px;margin-bottom:8px}.feature p{font-size:12px;line-height:1.8;color:#9eb3ca;margin:0}.footer{padding:26px 0 32px;border-top:1px solid #23364d;color:#97a9bd;font-size:12px}.footer .container{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.auth-wrap{max-width:474px;margin:64px auto 90px;padding:0 18px}.auth-card{border:1px solid #344458;background:#111e2fe8;padding:34px;border-radius:23px;box-shadow:0 30px 80px #0005}.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:31px}.auth-brand .logo{width:47px;height:47px}.auth-card h1{font-size:28px;margin:0 0 8px;letter-spacing:-1px}.auth-card .subtitle{margin:0 0 24px;color:#a4b5c8;font-size:13px;line-height:1.7}.form-field{margin:18px 0}.form-field label{display:block;font-size:12px;color:#c0d0e2;margin-bottom:9px;font-weight:700}.form-field input{width:100%;border:1px solid #3b5064;border-radius:11px;background:#0c1623;color:#ecf8ff;padding:15px;outline:none}.form-field input:focus{border-color:#68e9bb;box-shadow:0 0 0 3px #62e8bd18}.form-field small{display:block;margin-top:7px;color:#94a9c3;line-height:1.5}.button.full{width:100%;padding:15px;margin-top:13px;font-size:14px}.auth-foot{border-top:1px solid #304256;padding-top:19px;margin-top:25px;color:#9bb2c6;font-size:12px;text-align:center}.alert{border:1px solid #875f5f;background:#3b1e29;color:#ffc5c5;border-radius:10px;padding:12px;font-size:12px;margin-bottom:17px;line-height:1.5}.alert.ok{background:#11372f;border-color:#286e59;color:#a1f6d2}.consent-list{margin:18px 0;padding:0;list-style:none}.consent-list li{border:1px solid #304b5e;border-radius:12px;padding:14px 14px;margin:9px 0;display:flex;align-items:center;gap:10px;color:#d6e7ee;font-size:13px}.consent-list .check{color:#77ecc0;font-size:16px}.button-row{display:flex;gap:10px}.button-row>*{flex:1}.portal{padding:35px 0 85px}.portal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}.portal h1{font-size:35px;letter-spacing:-1.3px;margin:8px 0 7px}.portal .sub{color:#9daec6;font-size:13px;margin:0}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:26px 0}.stat{background:#112133;border:1px solid #2c4358;border-radius:17px;padding:23px}.stat small{color:#9fb6c9;font-size:12px}.stat strong{display:block;font-size:30px;margin-top:10px}.portal-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:18px}.panel{background:#111d2e;border:1px solid #2d4357;border-radius:18px;padding:24px;margin-bottom:18px;min-width:0}.panel h2{font-size:19px;margin:0 0 7px}.panel p{color:#95abc0;font-size:12px;line-height:1.7}.panel h3{margin:20px 0 8px;font-size:13px}.item{padding:14px 0;border-bottom:1px solid #2a3b50;display:flex;gap:11px;justify-content:space-between;align-items:center}.item:last-child{border-bottom:none}.item-title{font-size:13px;font-weight:700;overflow-wrap:anywhere}.item-sub{font-size:11px;color:#9ab0c4;overflow-wrap:anywhere;margin-top:5px}.small-tag{font-size:10px;border:1px solid #416757;color:#b4f2d6;border-radius:999px;padding:5px 9px;white-space:nowrap}.code{display:block;background:#080f19;border:1px solid #2d4257;color:#a7edd1;padding:14px;border-radius:10px;overflow:auto;word-break:break-all;font-size:12px;font-family:Consolas,monospace;margin:12px 0;white-space:pre-wrap}.tight{margin-bottom:6px}.security-note{color:#b9a983;font-size:11px;line-height:1.6}.side-head{display:flex;gap:8px;align-items:center}.top-border{border-top:1px solid #2b3e50;padding-top:19px;margin-top:21px}.hide-visually{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.mono{font-family:Consolas,monospace}.help-link{color:#98f4d0;text-decoration:underline;text-underline-offset:3px}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:32px;padding-top:63px}.preview-shell{max-width:500px}.features{grid-template-columns:1fr 1fr}.portal-grid{grid-template-columns:1fr}}
@media(max-width:560px){.nav .container{height:67px}.nav-links .pill{display:none}.hero h1{font-size:42px;letter-spacing:-2px}.lead{font-size:14px}.preview-shell{padding:19px}.features{grid-template-columns:1fr}.section{padding-top:25px}.auth-wrap{margin-top:31px}.auth-card{padding:24px 19px}.portal h1{font-size:29px}.stat-grid{grid-template-columns:1fr 1fr;gap:10px}.stat:last-child{grid-column:span 2}.stat{padding:17px}.stat strong{font-size:24px}.panel{padding:20px}.nav .brand{font-size:20px}.button-row{flex-direction:column}}

.previewbar{position:sticky;top:0;z-index:50;background:#071522f5;border-bottom:1px solid #3c5a70;padding:10px 16px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.previewbar button{border:1px solid #38566b;border-radius:9px;padding:9px 12px;background:#15273b;color:#bdd2e4}.previewbar button.active{background:#79e8c1;color:#082e2c;border-color:#79e8c1}.previewmark{font-size:10px;letter-spacing:.06em;color:#ffdbb0;text-align:center;background:#422c27;padding:9px}.preview-alert{position:fixed;bottom:20px;left:20px;right:20px;max-width:430px;margin:auto;background:#203a4e;border:1px solid #6ac9c7;padding:17px;border-radius:13px;z-index:100;display:none;font-size:12px;color:#e9ffff;line-height:1.6}
</style></head><body><div class="previewmark">VISUAL PREVIEW ONLY · NO USER ACCOUNTS OR REAL SIGN-IN ON THIS FILE</div><nav class="previewbar"><button data-tab="0" class="active">Home</button><button data-tab="1">Sign-in</button><button data-tab="2">Developer portal</button><button data-tab="3">Consent</button></nav><div id="preview-root"></div><div id="preview-alert" class="preview-alert">This is a design preview. Authentication and client registration run only after the backend is deployed.</div><script>const views=["\u003cheader class=\"nav\">\u003cdiv class=\"container\">\u003ca href=\"/\" class=\"brand\">\u003cspan class=\"logo\">\u003cspan aria-hidden=\"true\">◈\u003c/span>\u003c/span>\u003cspan>HB \u003cem>ID\u003c/em>\u003c/span>\u003c/a>\u003cdiv class=\"nav-links\">\u003ca class=\"pill\" href=\"/.well-known/openid-configuration\">OIDC endpoints ↗\u003c/a>\u003ca href=\"/portal\" class=\"button-secondary\">Developer portal ↗\u003c/a>\u003c/div>\u003c/div>\u003c/header>\u003cmain class=\"container\">\u003cdiv class=\"hero\">\u003cdiv>\u003cdiv class=\"eyebrow\">● Private identity infrastructure\u003c/div>\u003ch1>One identity.\u003cbr>\u003cspan class=\"gradient\">Every connected app.\u003c/span>\u003c/h1>\u003cp class=\"lead\">Meet HB ID — a modern, independent identity platform. Connect your business websites with a single secure sign-in experience, using the OpenID Connect standard.\u003c/p>\u003cdiv class=\"actions\">\u003ca class=\"button\" href=\"/portal\">Open developer portal →\u003c/a>\u003ca class=\"button-secondary\" href=\"/.well-known/openid-configuration\">Explore OIDC discovery ↗\u003c/a>\u003c/div>\u003cp class=\"hint\">Own your brand · Register clients · Control consent\u003c/p>\u003c/div>\u003cdiv class=\"preview-shell\">\u003cspan class=\"floating-label\">◉ Secure sign-in portal\u003c/span>\u003cdiv class=\"mock-avatar\">◈\u003c/div>\u003ch2>Welcome to HB ID\u003c/h2>\u003cp>Sign in once. Access your connected websites with confidence.\u003c/p>\u003cdiv class=\"mock-input\">✉ &nbsp; Email address\u003c/div>\u003cdiv class=\"mock-input\">⌑ &nbsp; Password\u003c/div>\u003cdiv class=\"mock-button\">Continue securely →\u003c/div>\u003cdiv class=\"bottom-caption\">\u003cspan>🔒 Protected login\u003c/span>\u003cspan>Powered by OpenID Connect\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003csection class=\"section\">\u003cdiv class=\"eyebrow\">What you're building\u003c/div>\u003ch2>Made for your digital ecosystem\u003c/h2>\u003cp class=\"section-sub\">Start with your own sites, then connect other trusted websites using their unique client credentials.\u003c/p>\u003cdiv class=\"features\">\u003cdiv class=\"feature\">\u003cdiv class=\"icon\">⌘\u003c/div>\u003cstrong>One central login\u003c/strong>\u003cp>Create and manage user accounts through one hosted identity provider.\u003c/p>\u003c/div>\u003cdiv class=\"feature\">\u003cdiv class=\"icon\">⛨\u003c/div>\u003cstrong>Consent-first sharing\u003c/strong>\u003cp>Users approve which registered websites can request access to their identity details.\u003c/p>\u003c/div>\u003cdiv class=\"feature\">\u003cdiv class=\"icon\">⚙\u003c/div>\u003cstrong>Developer integrations\u003c/strong>\u003cp>Register callback URLs, get a client ID and secret, and connect any standards-compatible OIDC website.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003c/main>","\u003cmain class=\"auth-wrap\">\u003cdiv class=\"auth-card\">\u003cdiv class=\"auth-brand\">\u003cspan class=\"logo\">\u003cspan aria-hidden=\"true\">◈\u003c/span>\u003c/span>\u003cspan class=\"brand\">HB \u003cem>ID\u003c/em>\u003c/span>\u003c/div>\u003ch1>Developer sign in\u003c/h1>\u003cp class=\"subtitle\">Manage HB ID accounts and connect your websites.\u003c/p>\u003cform action=\"/portal/login\" method=\"post\">\u003cdiv class=\"form-field\">\u003clabel for=\"email\">Email address\u003c/label>\u003cinput id=\"email\" name=\"email\" type=\"email\" required autocomplete=\"username\" placeholder=\"you@example.com\"  >\u003csmall>\u003c/small>\u003c/div>\u003cdiv class=\"form-field\">\u003clabel for=\"password\">Password\u003c/label>\u003cinput id=\"password\" name=\"password\" type=\"password\" required autocomplete=\"current-password\" placeholder=\"Your password\"  >\u003csmall>\u003c/small>\u003c/div>\u003cbutton class=\"button full\" type=\"submit\">Sign in to portal →\u003c/button>\u003c/form>\u003cp class=\"hint\" style=\"text-align:center;margin-top:22px\">\u003ca class=\"help-link\" href=\"/\">← Back to HB ID\u003c/a>\u003c/p>\u003cdiv class=\"auth-foot\">⛨ &nbsp; Protected authentication · HB ID\u003c/div>\u003c/div>\u003c/main>","\u003cheader class=\"nav\">\u003cdiv class=\"container\">\u003ca href=\"/\" class=\"brand\">\u003cspan class=\"logo\">\u003cspan aria-hidden=\"true\">◈\u003c/span>\u003c/span>\u003cspan>HB \u003cem>ID\u003c/em>\u003c/span>\u003c/a>\u003cdiv class=\"nav-links\">\u003ca class=\"pill\" href=\"/.well-known/openid-configuration\">OIDC endpoints ↗\u003c/a>\u003ca href=\"/portal\" class=\"button-secondary\">Developer portal ↗\u003c/a>\u003c/div>\u003c/div>\u003c/header>\u003cmain class=\"container portal\">\u003cdiv class=\"portal-top\">\u003cdiv>\u003cdiv class=\"eyebrow\">CONTROL CENTER\u003c/div>\u003ch1>Developer portal \u003cspan class=\"gradient\">↗\u003c/span>\u003c/h1>\u003cp class=\"sub\">Welcome back, Demo Owner. Manage your connected websites and people.\u003c/p>\u003c/div>\u003cform action=\"/portal/logout\" method=\"post\">\u003cinput type=\"hidden\" name=\"_csrf\" value=\"demo\">\u003cbutton class=\"button-secondary\" type=\"submit\">Sign out ↗\u003c/button>\u003c/form>\u003c/div>\u003cdiv class=\"stat-grid\">\u003cdiv class=\"stat\">\u003csmall>Registered applications\u003c/small>\u003cstrong>2\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Identity accounts\u003c/small>\u003cstrong>1\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Protocol\u003c/small>\u003cstrong>OIDC\u003c/strong>\u003c/div>\u003c/div>\u003cdiv class=\"portal-grid\">\u003cdiv>\u003csection class=\"panel\">\u003ch2>Connected applications\u003c/h2>\u003cp>Register websites that you control. Every website needs a unique callback URL.\u003c/p>\u003cdiv class=\"item\">\u003cdiv>\u003cdiv class=\"item-title\">HB Store\u003c/div>\u003cdiv class=\"item-sub mono\">hb_example_store\u003c/div>\u003c/div>\u003cspan class=\"small-tag\">OIDC\u003c/span>\u003c/div>\u003cdiv class=\"item\">\u003cdiv>\u003cdiv class=\"item-title\">ClinicFlow\u003c/div>\u003cdiv class=\"item-sub mono\">hb_clinic_demo\u003c/div>\u003c/div>\u003cspan class=\"small-tag\">OIDC\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003ch2>+ Register application\u003c/h2>\u003cp>Clients use Authorization Code + PKCE with confidential client authentication.\u003c/p>\u003cform action=\"/portal/apps\" method=\"post\">\u003cinput type=\"hidden\" name=\"_csrf\" value=\"demo\">\u003cdiv class=\"form-field\">\u003clabel for=\"name\">Application name\u003c/label>\u003cinput id=\"name\" name=\"name\" type=\"text\" required  placeholder=\"e.g. HB Store\"  >\u003csmall>\u003c/small>\u003c/div>\u003cdiv class=\"form-field\">\u003clabel for=\"redirect_uri\">Callback / redirect URL\u003c/label>\u003cinput id=\"redirect_uri\" name=\"redirect_uri\" type=\"url\" required  placeholder=\"https://store.example.com/auth/callback\"  >\u003csmall>HTTPS required; localhost HTTP permitted for testing.\u003c/small>\u003c/div>\u003cbutton class=\"button\" type=\"submit\">Create OIDC client →\u003c/button>\u003c/form>\u003c/section>\u003c/div>\u003cdiv>\u003csection class=\"panel\">\u003ch2>HB ID members\u003c/h2>\u003cp>Manage access to the central identity system.\u003c/p>\u003cdiv class=\"item\">\u003cdiv>\u003cdiv class=\"item-title\">Demo Owner ★\u003c/div>\u003cdiv class=\"item-sub\">demo@example.com\u003c/div>\u003c/div>\u003cspan class=\"small-tag\">Admin\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003ch2>+ Create an account\u003c/h2>\u003cp>Invite-only accounts for the initial release. You must transfer the temporary password privately.\u003c/p>\u003cform action=\"/portal/users\" method=\"post\">\u003cinput type=\"hidden\" name=\"_csrf\" value=\"demo\">\u003cdiv class=\"form-field\">\u003clabel for=\"name\">Full name\u003c/label>\u003cinput id=\"name\" name=\"name\" type=\"text\" required  placeholder=\"Full name\"  >\u003csmall>\u003c/small>\u003c/div>\u003cdiv class=\"form-field\">\u003clabel for=\"email\">Email\u003c/label>\u003cinput id=\"email\" name=\"email\" type=\"email\" required  placeholder=\"member@example.com\"  >\u003csmall>\u003c/small>\u003c/div>\u003cdiv class=\"form-field\">\u003clabel for=\"password\">Temporary password (14+ characters)\u003c/label>\u003cinput id=\"password\" name=\"password\" type=\"password\" required   minlength=\"14\" >\u003csmall>\u003c/small>\u003c/div>\u003cbutton class=\"button-secondary\" type=\"submit\">Create user →\u003c/button>\u003c/form>\u003cp class=\"security-note\">Email verification, password reset and MFA must be added before allowing public self-registration.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch2>Integration settings\u003c/h2>\u003ch3>Issuer\u003c/h3>\u003ccode class=\"code\">https://hb-id.example.com\u003c/code>\u003ch3>Discovery URL\u003c/h3>\u003ccode class=\"code\">https://hb-id.example.com/.well-known/openid-configuration\u003c/code>\u003ch3>Scopes\u003c/h3>\u003ccode class=\"code\">openid profile email\u003c/code>\u003ca class=\"help-link\" href=\"/.well-known/openid-configuration\">Open discovery endpoint ↗\u003c/a>\u003cp class=\"security-note top-border\">This is an MVP. Do not use for patient records, financial transactions, or other sensitive production accounts without a security review, verified email, MFA, account recovery and monitoring.\u003c/p>\u003c/section>\u003c/div>\u003c/div>\u003c/main>","\u003cmain class=\"auth-wrap\">\u003cdiv class=\"auth-card\">\u003cdiv class=\"auth-brand\">\u003cspan class=\"logo\">\u003cspan aria-hidden=\"true\">◈\u003c/span>\u003c/span>\u003cspan class=\"brand\">HB \u003cem>ID\u003c/em>\u003c/span>\u003c/div>\u003ch1>Allow access?\u003c/h1>\u003cp class=\"subtitle\">HB Store is requesting permission to access your identity.\u003c/p>\u003cdiv class=\"floating-label\">Request from HB Store\u003c/div>\u003cul class=\"consent-list\">\u003cli>\u003cspan class=\"check\">✓\u003c/span>Confirm your HB ID\u003c/li>\u003cli>\u003cspan class=\"check\">✓\u003c/span>View your profile name\u003c/li>\u003cli>\u003cspan class=\"check\">✓\u003c/span>View verified email address (if available)\u003c/li>\u003c/ul>\u003cp class=\"hint\">Only approve websites you recognize. Your password is never shared with the website.\u003c/p>\u003cdiv class=\"button-row\">\u003cform action=\"/interaction/sample/confirm\" method=\"post\">\u003cbutton class=\"button full\" type=\"submit\">Allow access →\u003c/button>\u003c/form>\u003cform action=\"/interaction/sample/abort\" method=\"post\">\u003cbutton class=\"button-secondary full\" type=\"submit\">Deny\u003c/button>\u003c/form>\u003c/div>\u003cdiv class=\"auth-foot\">⛨ &nbsp; Protected authentication · HB ID\u003c/div>\u003c/div>\u003c/main>"];function show(n){document.getElementById('preview-root').innerHTML=views[n];document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',Number(x.dataset.tab)===n));document.querySelectorAll('input[type=password]').forEach(x=>{x.placeholder='Preview only — no passwords';x.disabled=true;});window.scrollTo(0,0)};document.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>show(Number(btn.dataset.tab))));document.addEventListener('click',e=>{const link=e.target.closest('#preview-root a');if(!link)return;const path=link.getAttribute('href');if(path?.startsWith('/')){e.preventDefault();if(path==='/portal')show(2);else if(path==='/portal/login')show(1);else if(path==='/')show(0);else alertPreview()}});document.addEventListener('submit',e=>{e.preventDefault();alertPreview()});let noticeTimeout;function alertPreview(){const el=document.getElementById('preview-alert');el.style.display='block';clearTimeout(noticeTimeout);noticeTimeout=setTimeout(()=>el.style.display='none',4000)}show(0);</script></body></html>
