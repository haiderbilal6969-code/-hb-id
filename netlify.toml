# Netlify Free hosting for a small-scale HB ID test deployment.
# This file contains NO credentials. Supply secrets under Netlify site settings.
[build]
  publish = "public"
  command = "npm run check"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["oidc-provider", "pg"]

# Send every dynamic route, including OpenID discovery, through our Express app.
# Static files such as /style.css are served from public/ first.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/oidc/:splat"
  status = 200
  force = false

# These labels are shown on Netlify's official Deploy-to-Netlify form.
# No credentials are committed to GitHub.
[template.environment]
  DATABASE_URL = "Paste the private PostgreSQL URI for your Neon hb-id-dev database"
  BOOTSTRAP_ADMIN_EMAIL = "Your administrator email address"
  BOOTSTRAP_ADMIN_PASSWORD = "Create a NEW unique 16+ character administrator password"
